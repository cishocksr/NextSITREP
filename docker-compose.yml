services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: vet-connect-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-veteran_connection}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vet-connect-network

  # ── pgAdmin (optional — run with: docker compose --profile tools up) ────────
  # Access at http://localhost:5050
  # Login with PGADMIN_EMAIL / PGADMIN_PASSWORD from your .env
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: vet-connect-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - vet-connect-network
    profiles:
      - tools

  # ── Spring Boot Backend ─────────────────────────────────────────────────────
  # NOTE: Only needed if running the full stack in Docker.
  # For active development, run the backend with your IDE or `./mvnw spring-boot:run`
  # and keep only the postgres service running in Docker.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vet-connect-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # Database — points to the postgres service by name (Docker DNS resolves "postgres")
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?ERROR - POSTGRES_DB not set}
      POSTGRES_USER: ${POSTGRES_USER:?ERROR - POSTGRES_USER not set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ERROR - POSTGRES_PASSWORD not set}
      # JWT
      JWT_SECRET: ${JWT_SECRET:?ERROR - JWT_SECRET not set}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      JWT_COOKIE_NAME: ${JWT_COOKIE_NAME:-vc_session}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-false}
      JWT_COOKIE_SAME_SITE: ${JWT_COOKIE_SAME_SITE:-Lax}
      AUTH_RATE_LIMIT_MAX_ATTEMPTS: ${AUTH_RATE_LIMIT_MAX_ATTEMPTS:-10}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-900000}
      # CORS — comma-separated list of allowed frontend origins
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # VA API
      VA_API_KEY: ${VA_API_KEY:-your-va-api-key-here}
      VA_API_BASE_URL: ${VA_API_BASE_URL:-https://sandbox-api.va.gov}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - vet-connect-network
    profiles:
      - full-stack

  # ── Next.js Frontend ────────────────────────────────────────────────────────
  # NOTE: Same as backend — only needed for full Docker stack.
  # For active development, run with `bun dev` or `npm run dev`.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:${BACKEND_PORT:-8080}}
    container_name: vet-connect-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:${BACKEND_PORT:-8080}}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vet-connect-network
    profiles:
      - full-stack

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  vet-connect-network:
    driver: bridge
