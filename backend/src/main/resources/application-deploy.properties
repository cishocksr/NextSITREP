# Shared hardened settings for the aws-dev and prod profile groups.
# JWT/database/CORS are mandatory in application.properties; no local defaults here.
# Default one hour; startup validation permits at most 24 hours in deployments.
jwt.expiration=${JWT_EXPIRATION:3600000}
# Ingress must terminate HTTPS and normalize forwarding headers; exact peer IPs only.
security.https.required=true
