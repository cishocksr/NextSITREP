spring.application.name=veterans-connect

# ─── Database ────────────────────────────────────────────────────────────────
# Reads from environment variables when running in Docker.
# Falls back to localhost defaults for running directly in your IDE.
#
# Docker injects:  POSTGRES_HOST=postgres  POSTGRES_DB=...  etc.
# Local dev uses:  localhost / veteran_connection / postgres / postgres
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:veteran_connection}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}

# Flyway owns schema creation and changes. Hibernate validates that entities
# still match the migrated database.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.org.springframework.web=DEBUG
logging.level.com.veteransconnect=DEBUG

# ─── JWT ─────────────────────────────────────────────────────────────────────
# Reads JWT_SECRET from environment. Falls back to dev-only key locally.
# NEVER use the fallback key in production — set the real JWT_SECRET env var.
# Generate a production key: openssl rand -base64 32
jwt.secret=${JWT_SECRET:VmV0ZXJhbnNDb25uZWN0U2VjcmV0S2V5Rm9yVmV0ZXJhbnNDb25uZWN0MjAyNg==}

# Token lifetime in milliseconds. 86400000 = 24 hours.
jwt.expiration=${JWT_EXPIRATION:86400000}

# ─── CORS ────────────────────────────────────────────────────────────────────
# Comma-separated list of allowed frontend origins.
# Docker sets CORS_ALLOWED_ORIGINS via docker-compose environment.
# Local dev falls back to http://localhost:3000 (Next.js dev server).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ─── VA Facilities API ────────────────────────────────────────────────────────
# Get a FREE sandbox key at: https://developer.va.gov/apply (instant approval)
# Set VA_API_KEY as an environment variable — never commit the real key.
va.api.base-url=https://api.va.gov
va.api.key=${VA_API_KEY:your-va-api-key-here}
va.api.facilities.default-radius=50
va.api.connect-timeout-ms=${VA_API_CONNECT_TIMEOUT_MS:2000}
va.api.read-timeout-ms=${VA_API_READ_TIMEOUT_MS:5000}

# ─── Geocoding (OpenStreetMap Nominatim) ──────────────────────────────────────
# Free, no API key needed. Nominatim requires a descriptive User-Agent (their ToS).
geocoding.nominatim.base-url=https://nominatim.openstreetmap.org
geocoding.nominatim.user-agent=VeteransConnect/1.0 (contact@veteransconnect.org)
geocoding.nominatim.connect-timeout-ms=${GEOCODING_CONNECT_TIMEOUT_MS:2000}
geocoding.nominatim.read-timeout-ms=${GEOCODING_READ_TIMEOUT_MS:3000}
geocoding.nominatim.cache-enabled=${GEOCODING_CACHE_ENABLED:true}
