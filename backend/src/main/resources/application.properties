spring.application.name=veterans-connect

# Select exactly one environment explicitly; never default to relaxed local settings.
spring.profiles.default=none
spring.profiles.group.aws-dev=deploy
spring.profiles.group.prod=deploy

# Mandatory outside local/test. Startup validation reports property names, never values.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Flyway owns schema creation and changes. Hibernate validates that entities
# still match the migrated database.
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# Logging
logging.level.org.springframework.web=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB:INFO}
logging.level.com.veteransconnect=${LOGGING_LEVEL_COM_VETERANSCONNECT:INFO}

# JWT
# JWT_SECRET is mandatory in every runtime environment; there is no fallback key.
# JwtService validates the supplied key at startup and rejects the known legacy key.
# Generate a different random key per environment: openssl rand -base64 32
jwt.secret=${JWT_SECRET}

# Token lifetime in milliseconds. 86400000 = 24 hours.
jwt.expiration=${JWT_EXPIRATION:86400000}
security.jwt.cookie-name=${JWT_COOKIE_NAME:vc_session}
security.jwt.cookie-secure=${JWT_COOKIE_SECURE:true}
security.jwt.cookie-same-site=${JWT_COOKIE_SAME_SITE:Lax}

# Rate limiting
# Limits login/register attempts per endpoint + IP + email.
security.auth-rate-limit.max-attempts=${AUTH_RATE_LIMIT_MAX_ATTEMPTS:10}
security.auth-rate-limit.window-ms=${AUTH_RATE_LIMIT_WINDOW_MS:900000}
security.auth-rate-limit.trust-forwarded-headers=${AUTH_RATE_LIMIT_TRUST_FORWARDED_HEADERS:false}

# Exact public browser origins; deployments must use HTTPS.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# VA Facilities API
# Get a sandbox key at: https://developer.va.gov/apply
# Set VA_API_KEY as an environment variable — never commit the real key.
va.api.base-url=${VA_API_BASE_URL:https://sandbox-api.va.gov}
va.api.key=${VA_API_KEY:your-va-api-key-here}
va.api.facilities.default-radius=50
va.api.connect-timeout-ms=${VA_API_CONNECT_TIMEOUT_MS:2000}
va.api.read-timeout-ms=${VA_API_READ_TIMEOUT_MS:5000}

# Geocoding (OpenStreetMap Nominatim)
# Free, no API key needed. Nominatim requires a descriptive User-Agent (their ToS).
geocoding.nominatim.base-url=https://nominatim.openstreetmap.org
geocoding.nominatim.user-agent=${GEOCODING_USER_AGENT:NextSITREP/1.0 (+https://github.com/cishocksr/NextSITREP)}
geocoding.nominatim.connect-timeout-ms=${GEOCODING_CONNECT_TIMEOUT_MS:2000}
geocoding.nominatim.read-timeout-ms=${GEOCODING_READ_TIMEOUT_MS:3000}
geocoding.nominatim.cache-enabled=${GEOCODING_CACHE_ENABLED:true}

# Guarded Tomcat processing owns forwarding; never trust private ranges globally.
server.forward-headers-strategy=none
security.proxy.trusted-ips=${TRUSTED_PROXY_IPS:}
security.https.required=false
