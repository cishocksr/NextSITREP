# Test-only resources are not packaged in the application JAR.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Inherit Flyway and Hibernate validate; never disable the production security chain.
security.jwt.cookie-secure=false
cors.allowed-origins=http://localhost:3000

# Public test-only fixture, distinct from the rejected legacy key. Never use at runtime.
