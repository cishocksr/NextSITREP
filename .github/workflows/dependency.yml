name: Dependency Check

on:
    schedule:
        # Run every Monday at 9 AM UTC
        - cron: "0 9 * * 1"
    workflow_dispatch:
    push:
        branches: [main]
        paths:
            - "backend/pom.xml"
            - "fontend/package.json"
            - "fontend/bun.lock"

jobs:
    backend-dependencies:
        name: Backend Dependency Scan
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: ./backend

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: "temurin"
                  cache: "maven"

            - name: Run dependency check
              run: ./mvnw dependency:tree -B

            - name: Check for updates
              run: ./mvnw versions:display-dependency-updates -B

    frontend-dependencies:
        name: Frontend Dependency Scan
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: ./fontend

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Check for outdated packages
              run: bun outdated || true

            - name: Run npm audit
              run: bun pm trust --all && npm audit --audit-level=moderate || true
