name: Dependency Security

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    # Independent full scan of default-branch dependencies, even without code changes.
    - cron: '17 9 * * 1'

permissions:
  contents: read

jobs:
  scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: dependency-security-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        shell: bash
    env:
      JAVA_VERSION: '21.0.13+9'

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          overwrite-settings: false

      # Reuse the existing backend gate's dependency cache, without PR writes.
      - name: Restore Maven dependencies
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.m2/repository
          key: backend-maven-${{ runner.os }}-${{ runner.arch }}-temurin-${{ env.JAVA_VERSION }}-${{ hashFiles('backend/pom.xml', 'backend/.mvn/**', 'backend/mvnw') }}

      - name: Test scanning policy and failure handling
        run: python3 -m unittest discover -s scripts/security -p 'test_*.py' -v

      - name: Install verified OSV Scanner
        run: |
          python3 scripts/security/install_osv.py "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" --version

      - name: Resolve backend dependencies including test scope
        working-directory: ./backend
        run: |
          mkdir -p "$RUNNER_TEMP/security-reports/backend"
          ./mvnw -B -ntp org.apache.maven.plugins:maven-dependency-plugin:3.8.1:tree -DoutputType=json -DoutputFile="$RUNNER_TEMP/security-reports/backend/maven-tree.json"
          python3 ../scripts/security/maven_inventory.py "$RUNNER_TEMP/security-reports/backend/maven-tree.json" "$RUNNER_TEMP/security-reports/backend/maven.osv-scanner.json"

      # Still scan the other ecosystem if an earlier step failed; failures remain fatal.
      - name: Scan frontend lockfile
        if: ${{ !cancelled() }}
        run: python3 scripts/security/scan.py --scanner "$RUNNER_TEMP/osv-scanner" --lockfile frontend/bun.lock --output "$RUNNER_TEMP/security-reports/frontend"

      - name: Scan resolved Maven dependencies
        if: ${{ !cancelled() }}
        run: python3 scripts/security/scan.py --scanner "$RUNNER_TEMP/osv-scanner" --lockfile "osv-scanner:$RUNNER_TEMP/security-reports/backend/maven.osv-scanner.json" --output "$RUNNER_TEMP/security-reports/backend"

      - name: Upload inventories, advisory details and policy reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-security-results
          path: ${{ runner.temp }}/security-reports/
          retention-days: 14
          if-no-files-found: warn
