name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "24.22.2"
  BUN_VERSION: "1.4.4"

jobs:
  # Backend verification includes packaging and the existing 70% JaCoCo gate.
  backend:
    name: Backend CI (Java ${{ matrix.java }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    strategy:
      matrix:
        java: ["21"]

    concurrency:
      group: ${{ github.workflow }}-backend-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    defaults:
      run:
        shell: bash
        working-directory: ./backend

    env:
      JAVA_VERSION: "21.0.13+9"

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          overwrite-settings: false

      # Cache dependencies only, with no broad fallback keys or PR cache writes.
      - name: Restore Maven dependencies
        id: maven-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.m2/repository
          key: backend-maven-${{ runner.os }}-${{ runner.arch }}-temurin-${{ env.JAVA_VERSION }}-${{ hashFiles('backend/pom.xml', 'backend/.mvn/**', 'backend/mvnw') }}

      - name: Verify Java and Maven wrapper
        run: |
          test -x ./mvnw
          java -version
          ./mvnw --version

      - name: Verify backend and enforce coverage
        run: ./mvnw clean verify -B -ntp

      - name: Verify reports were generated
        run: |
          test -s target/site/jacoco/jacoco.xml
          test -s target/site/jacoco/index.html
          test -d target/surefire-reports

      - name: Save Maven dependencies
        if: success() && github.event_name == 'push' && steps.maven-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.m2/repository
          key: ${{ steps.maven-cache.outputs.cache-primary-key }}

      - name: Upload test and coverage results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-test-results
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
          retention-days: 7
          if-no-files-found: warn

  # One frontend gate for every PR; no path filters that could leave checks pending.
  frontend:
    name: Frontend CI (Bun)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    concurrency:
      group: ${{ github.workflow }}-frontend-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    defaults:
      run:
        shell: bash
        working-directory: ./frontend

    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Verify tool versions
        run: |
          node --version
          bun --version
          test "$(node --version)" = "v$NODE_VERSION"
          test "$(bun --version)" = "$BUN_VERSION"

      # Cache downloads only. Always reconstruct node_modules from the frozen lock.
      - name: Cache Bun downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: frontend-${{ runner.os }}-${{ runner.arch }}-node-${{ env.NODE_VERSION }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('frontend/bun.lock') }}

      - name: Install frontend dependencies
        timeout-minutes: 5
        run: bun install --frozen-lockfile

      - name: Run frontend unit and component tests
        timeout-minutes: 3
        run: bun run test:run

      - name: Run Biome linting
        run: bun run lint:check

      - name: Run Biome format check
        run: bun run format:check

      # Build first so the explicit type check includes current generated routes.
      - name: Build Next.js
        timeout-minutes: 5
        run: bun run build
        env:
          API_PROXY_TARGET: http://127.0.0.1:8080

      - name: Type check
        run: bun run type-check

      # Builds an isolated copy with loopback API/image/error fixtures; no live backend.
      - name: Run production HTTP security regressions
        timeout-minutes: 3
        run: bun run test:security:http

  # Code Quality Overview Job
  quality-gate:
    name: Quality Gate
    permissions: {}
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()

    steps:
      - name: Check job results
        run: |
          echo "Backend Status: ${{ needs.backend.result }}"
          echo "Frontend Status: ${{ needs.frontend.result }}"

          if [[ "${{ needs.backend.result }}" != "success" ]] || [[ "${{ needs.frontend.result }}" != "success" ]]; then
            echo "❌ Quality gate failed"
            exit 1
          else
            echo "✅ Quality gate passed"
          fi
