name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "24.22.2"
  BUN_VERSION: "1.4.4"

jobs:
  # Backend CI Job
  backend:
    name: Backend CI (Java ${{ matrix.java }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: ["21"]

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: "temurin"
          cache: "maven"

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Verify Maven wrapper
        run: |
          if [ ! -f "./mvnw" ]; then
            echo "Error: Maven wrapper not found!"
            exit 1
          fi
          chmod +x ./mvnw

      - name: Build with Maven
        run: ./mvnw clean compile -B

      - name: Run tests
        run: ./mvnw test -B

      - name: Generate test report
        if: always()
        run: ./mvnw surefire-report:report -B

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/
          retention-days: 30

  # One frontend gate for every PR; no path filters that could leave checks pending.
  frontend:
    name: Frontend CI (Bun)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    concurrency:
      group: ${{ github.workflow }}-frontend-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    defaults:
      run:
        shell: bash
        working-directory: ./frontend

    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Verify tool versions
        run: |
          node --version
          bun --version
          test "$(node --version)" = "v$NODE_VERSION"
          test "$(bun --version)" = "$BUN_VERSION"

      # Cache downloads only. Always reconstruct node_modules from the frozen lock.
      - name: Cache Bun downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: frontend-${{ runner.os }}-${{ runner.arch }}-node-${{ env.NODE_VERSION }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('frontend/bun.lock') }}

      - name: Install frontend dependencies
        timeout-minutes: 5
        run: bun install --frozen-lockfile

      - name: Run frontend unit and component tests
        timeout-minutes: 3
        run: bun run test:run

      - name: Run Biome linting
        run: bun run lint:check

      - name: Run Biome format check
        run: bun run format:check

      # Build first so the explicit type check includes current generated routes.
      - name: Build Next.js
        timeout-minutes: 5
        run: bun run build
        env:
          API_PROXY_TARGET: http://127.0.0.1:8080

      - name: Type check
        run: bun run type-check

      # Builds an isolated copy with loopback API/image/error fixtures; no live backend.
      - name: Run production HTTP security regressions
        timeout-minutes: 3
        run: bun run test:security:http

  # Code Quality Overview Job
  quality-gate:
    name: Quality Gate
    permissions: {}
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()

    steps:
      - name: Check job results
        run: |
          echo "Backend Status: ${{ needs.backend.result }}"
          echo "Frontend Status: ${{ needs.frontend.result }}"

          if [[ "${{ needs.backend.result }}" != "success" ]] || [[ "${{ needs.frontend.result }}" != "success" ]]; then
            echo "❌ Quality gate failed"
            exit 1
          else
            echo "✅ Quality gate passed"
          fi
